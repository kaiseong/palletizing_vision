[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "parcel-pose"
version = "0.1.0"
description = "Perception-only D435 parcel center and line-yaw estimation"
requires-python = ">=3.12"
dependencies = [
  "numpy>=1.26",
]

[project.optional-dependencies]
vision = ["opencv-python-headless>=4.10"]
live = ["pyrealsense2>=2.58.1; platform_machine != 'aarch64'"]

[project.scripts]
parcel-pose = "parcel_pose.cli:main"
pallet = "parcel_pose.pallet_cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
addopts = "-q"
